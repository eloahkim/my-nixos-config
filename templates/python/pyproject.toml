[project]
name = "@PROJECT_SLUG@"
version = "0.1.0"
description = "Projeto Python criado com dev-new"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "black",
    "isort",
    "debugpy",
]

[tool.ruff]
line-length = 88
exclude = [".venv", ".devenv", ".direnv"]

[tool.black]
line-length = 88
extend-exclude = '''
/(\.venv|\.devenv|\.direnv)/
'''

[tool.isort]
profile = "black"
skip_glob = [".venv/*", ".devenv/*", ".direnv/*"]
